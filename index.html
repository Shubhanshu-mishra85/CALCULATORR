<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Pink Calculator UI</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">

<style>

/* RESET */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Orbitron',sans-serif;
}

/* BODY */

body{
    width:100%;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:#000;

    position:relative;
}

/* PINK BACKGROUND */

body::before{

    content:'';

    position:absolute;

    width:100%;
    height:100%;

    background:
    linear-gradient(
    rgba(255,20,147,0.5),
    rgba(0,0,0,0.85)
    ),

    url('https://wallpapercave.com/wp/wp8816338.jpg');

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    filter:blur(2px);

    transform:scale(1.05);
}

/* GLOW EFFECT */

.glow1,
.glow2{

    position:absolute;

    border-radius:50%;

    filter:blur(120px);
}

.glow1{

    width:500px;
    height:500px;

    background:#ff149340;

    top:-120px;
    left:-120px;
}

.glow2{

    width:450px;
    height:450px;

    background:#ff69b440;

    bottom:-100px;
    right:-100px;
}

/* WRAPPER */

.wrapper{

    position:relative;

    width:95%;
    max-width:450px;

    padding:35px;

    border-radius:35px;

    background:rgba(0,0,0,0.45);

    backdrop-filter:blur(25px);

    border:1px solid rgba(255,255,255,0.08);

    box-shadow:
    0 25px 60px rgba(0,0,0,0.6),
    0 0 30px #ff1493;
}

/* DISPLAY */

.display{

    width:100%;

    height:120px;

    border:none;
    outline:none;

    border-radius:20px;

    background:rgba(255,255,255,0.08);

    color:white;

    text-align:right;

    font-size:60px;

    padding:20px;

    margin-bottom:25px;
}

/* BUTTON GRID */

.buttons{

    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:18px;
}

/* BUTTON */

button{

    height:80px;

    border:none;

    border-radius:50%;

    font-size:28px;

    cursor:pointer;

    transition:0.2s;

    color:white;
}

/* NORMAL */

.btn{

    background:#1e1b4b;
}

/* OPERATOR */

.operator{

    background:#ff1493;
}

/* TOP */

.top{

    background:#f9a8d4;

    color:black;
}

/* ZERO */

.zero{

    grid-column:span 2;

    border-radius:50px;

    text-align:left;

    padding-left:32px;
}

/* HOVER */

button:hover{

    transform:scale(1.08);

    background:#ff69b4;

    color:black;

    box-shadow:
    0 0 20px #ff1493;
}

/* ACTIVE */

button:active{

    transform:scale(0.92);
}

/* FOOTER */

.footer{

    margin-top:25px;

    text-align:center;

    color:#f9a8d4;

    font-size:13px;

    letter-spacing:3px;
}

</style>
</head>

<body>

<!-- GLOW -->
<div class="glow1"></div>
<div class="glow2"></div>

<!-- WRAPPER -->
<div class="wrapper">

    <!-- DISPLAY -->
    <input
    type="text"
    class="display"
    value="0"
    readonly>

    <!-- BUTTONS -->
    <div class="buttons">

        <button class="top">AC</button>
        <button class="top">%</button>
        <button class="top">⌫</button>
        <button class="operator">÷</button>

        <button class="btn">7</button>
        <button class="btn">8</button>
        <button class="btn">9</button>
        <button class="operator">×</button>

        <button class="btn">4</button>
        <button class="btn">5</button>
        <button class="btn">6</button>
        <button class="operator">−</button>

        <button class="btn">1</button>
        <button class="btn">2</button>
        <button class="btn">3</button>
        <button class="operator">+</button>

        <button class="btn zero">0</button>
        <button class="btn">.</button>
        <button class="operator">=</button>

    </div>

    <!-- FOOTER -->
    <div class="footer">
        SHUBH
    </div>

</div>

</body>
</html>
